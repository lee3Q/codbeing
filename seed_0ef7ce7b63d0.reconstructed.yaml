goal: "Build codbeing, a private dogfooding-first local CLI MVP that analyzes structured personal DecisionTrace data and generates one useful evidence-based Runtime Analysis report for the user's own decision trajectory."
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
  - "Treat this as a reconstructed Seed recovered from Ouroboros event-store session orch_ec4cb2f171e6 / execution exec_54d23c8e2107."
  - "Prioritize private dogfooding usefulness over public release polish."
  - "Keep the first interface as a local CLI."
  - "Use local-first JSON input for structured DecisionTrace records and Markdown output for reports."
  - "Do not add telemetry, cloud sync, account systems, or web UI."
  - "Do not commit or expose raw personal logs, secrets, or private session backups."
acceptance_criteria:
  - "CLI can validate a DecisionTrace JSON file and reject missing required fields with clear errors."
  - "CLI can analyze structured traces and produce a Markdown Runtime Analysis report with evidence summary, detected trajectory, user-code hypothesis, current decision diff, recommended next protocol, confidence breakdown, uncertainty, and override language."
  - "Private academic and Nomusa dogfood fixture produces Runtime Analysis, classifies the work-study loss as an activation trigger rather than the core decision reason, and recommends the A/B/C practical exam decision protocol."
  - "Hard Mirror triggers only for high-impact decisions with medium-high or high reversibility cost, immediate action pressure, sufficient confidence, and direct similarity to prior activation patterns."
  - "Must-not-output guardrails prevent personality labels, direct life commands, hidden-feeling claims, invented evidence, external success predictions, unsupported judgments, and treating emotional trigger as the core reason."
  - "Privacy baseline prevents telemetry, secrets, raw personal logs, committed private traces outside ignored private paths, and accidental inclusion of session backup raw text."
